name: indo_universe
description: "인도네시아어유니버스 — 한국 화자 인도네시아어·말레이어 학습 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ^8.1.1
  cupertino_icons: ^1.0.8

  # Audio
  audioplayers: ^6.1.0

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  sqflite: ^2.4.0

  # Util
  csv: ^6.0.0
  flutter_svg: ^2.0.10+1
  flutter_tts: ^4.2.0

  # Drift (SQLite ORM)
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # Talkverse ID 로그인·스토어 결제 (한자 앱과 같은 구성, 2026-11-02)
  http: ^1.6.0
  flutter_web_auth_2: ^5.1.0
  flutter_secure_storage: ^10.3.4
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.3
  in_app_purchase_storekit: ^0.4.16
  video_player: ^2.14.1 # 언어감각 회차 영상(서버에서 바로 재생, 일본어앱과 같은 판)

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift codegen
  drift_dev: ^2.33.0
  build_runner: ^2.4.13

  # Launcher icons

flutter:
  uses-material-design: true

  assets:
    - assets/data/audio_manifest.json
    - assets/data/version.json
    - assets/data/script_rev.json
    - assets/curriculum_id.json
    - assets/data/dialogues/id/_meta.json
    - assets/data/dialogues/id/L1.json
    - assets/data/dialogues/ms/_meta.json
    - assets/images/ipa/
    - assets/data/dialogues/R1/survival/
    - assets/data/dialogues/R1/love/
    - assets/data/dialogues/R1/travel/
